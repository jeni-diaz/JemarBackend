# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - jemar-dev-webapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build Web/Jemar.Presentation.csproj --configuration Release

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D34F1D2BA0B74E6AB22BA7BF985AB820 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F393EB39B9C140E7B23034C4DD37D63D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C450292E7AA045C6A7A1C66F5235F956 }}

      - name: Apply database migrations
        run: |
          dotnet tool install --global dotnet-ef
          $runnerIp = (Invoke-WebRequest -Uri "https://api.ipify.org" -UseBasicParsing).Content.Trim()
          az sql server firewall-rule create --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --server jemar --name github-runner --start-ip-address $runnerIp --end-ip-address $runnerIp
          dotnet ef database update --project Jemar.Infrestructure/Jemar.Infrastructure.csproj --startup-project Web/Jemar.Presentation.csproj
          az sql server firewall-rule delete --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --server jemar --name github-runner --yes
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.AZURE_CONNECTION_STRING }}
          Jwt__Secret: ${{ secrets.JWT_SECRET }}
          Jwt__Issuer: ${{ secrets.JWT_ISSUER }}
          Jwt__Audience: ${{ secrets.JWT_AUDIENCE }}

      - name: Publish with dotnet
        run: dotnet publish Web/Jemar.Presentation.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D34F1D2BA0B74E6AB22BA7BF985AB820 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F393EB39B9C140E7B23034C4DD37D63D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C450292E7AA045C6A7A1C66F5235F956 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'jemar-dev-webapp'
          slot-name: 'Production'
          package: .